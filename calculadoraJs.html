<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <script>
        function calcular(event) {
            event.preventDefault();//Impede o envio do formulário para evitar recarregar a página

            var a = parseFloat(document.getElementById('a').value);
            var b = parseFloat(document.getElementById('b').value);
            var resultado;

            if (operacao == 'Somar') {
                resultado = a + b;
            } 
            
            else if (operacao == 'Diminuir') {
                resultado = a - b;
            } 
            
            else if (operacao == 'Multiplicar') {
                resultado = a * b;
            } 
            
            else if (operacao == 'Dividir') {
                    if (b !== 0) {
                        resultado = a / b;
                    } else {
                        resultado = 'Erro: Divisão por zero';
                    }
            }

            document.getElementById('resultado').textContent = resultado;
        }
    </script>
</head>
<body>
    <h1>Minha Calculadora!</h1>
    <form onsubmit="calcular(event)">
        a:<input type="text" id="a"><br><br>
        b:<input type="text" id="b"><br><br>

        Escolha a operação que deseja realizar.<br>

        <input type="submit" value="Somar" onclick="operacao='Somar'">
        <input type="submit" value="Diminuir" onclick="operacao='Diminuir'">
        <input type="submit" value="Multiplicar" onclick="operacao='Multiplicar'">
        <input type="submit" value="Dividir" onclick="operacao='Dividir'">

        <br><br>

        Resultado: <span id="resultado"></span>
    </form>
</body>
</html>
