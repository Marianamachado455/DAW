<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Luméa</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <header class="navbar">
        <h1 class="logo" onclick="irParaHome()">Luméa</h1>
    </header>

    <main>
        <section class="heroSection">
            <h2 class="titulo1">Cadastro</h2>

            <div class="form-wrapper">
                <form id="formCadastro" onsubmit="criarConta(event)">
                    <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" class="input-longo" required>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" class="input-pequeno" required>
                    </div>

                    <div class="campo">
                        <label for="data_nascimento">Data de nascimento</label>
                        <input type="date" id="data_nascimento" class="input-pequeno" required>
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="input-pequeno" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" class="input-pequeno" required>
                    </div>
                </div>

                <div class="checkbox-cadastro">
                    <div>
                        <input type="checkbox">
                        <span>Desejo receber novidades por email</span>
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label>Crie uma senha</label>
                        <input type="password" id="senha" class="input-pequeno" required>
                    </div>

                    <div class="campo">
                        <label>Confirme a senha</label>
                        <input type="password" id="confirmar-senha" class="input-pequeno" required>
                    </div>
                </div>

                <br>
                <button type="submit" class="botao-principal">
                    Cadastrar
                </button>
                <br>
            </form>
        </section>
    </main>

    <footer>
        <section class="sobre">
            <h3>Luméa</h3>
            <p>
                A Luméa nasceu do sonho de transformar o cuidado
                com a beleza em uma experiência única de bem-estar.
            </p>

        </section>

        <!-- Contato -->
        <section class="contato">
            <h3>Contato</h3>
            <p>Rua das Flores, 123</p>
            <p>(11) 98765-4321</p>
            <p>contato@lumea.com.br</p>
        </section>

        <section class="copyright">
            <p>
                © 2025 Luméa Estética. Todos os direitos reservados.
            </p>
        </section>
    </footer>
    <script src="../app.js"></script>
</body>
</html>
